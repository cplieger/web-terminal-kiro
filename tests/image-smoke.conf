# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK (HTTP GET
# /api/health on :9848) to report "healthy" - proving the server binds, the
# embedded UI is present, the health endpoint serves, AND that kiro-cli installed:
# health reports 200 only once a kiro-cli version is active.
#
# First boot is no longer blocking. entrypoint.sh hardens /config, prunes
# superseded agent runtimes and execs the server, which then downloads and
# verifies kiro-cli in the BACKGROUND (tool installs converge alongside it). So
# the listener comes up within seconds and a probe during the download answers 503
# with a reason instead of being refused; the harness still waits for "healthy", so
# what it proves is unchanged.
#
# TIMEOUT covers the image's HEALTHCHECK start-period (20m, the SELECTED startup
# tolerance) plus two 30s probe intervals (1260 = 1200 + 2x30). Neither budget
# covers the worst-case install: the archive fetch is bounded by a 60s
# no-progress stall guard rather than a wall-clock cap, and a failed attempt is
# retried up to 4 times with 30s/60s/120s backoff. Nor does it cover the
# interrupted-dpkg recovery (dpkg --audit and dpkg --configure -a, 300+30s each,
# taking the foreground sum from 1030s to 1690s), whose deadlines are reached
# only on a boot following an apt install that was killed mid-transaction - never
# on a healthy boot, where the audit probe is a no-op.
#
# That shortfall is DELIBERATE (decided 2026-07), not a pending decision. This
# harness runs on a GitHub-hosted runner over a fast link, where the 528MB
# download takes minutes; a smoke boot that outlasts the start-period means
# something is genuinely wrong, so failing here is correct signal rather than a
# false negative. Raising both budgets to cover the retry envelope would make a
# hung CI job burn ~3 hours of Actions time before failing, which is a real
# recurring cost against a theoretical worst case. At runtime the same shortfall
# is cosmetic: health
# failures never restart the container (the restart policy acts on process exit),
# so a slow first boot shows unhealthy and then converges. Keep in lockstep with
# the Dockerfile start-period and its HEALTHCHECK comment, which carries the full
# derivation.
SMOKE_APP_NAME=web-terminal-kiro
SMOKE_TIMEOUT=1260

# Post-health verification. Reaching "healthy" already proves kiro-cli was
# downloaded, digest-verified against the pin, probed for its own version and
# had its required settings asserted, so what the hook adds is the serving and
# session behaviour health does not gate:
#
#   1. every target of the served importmap answers 200 with a body
#   2. every system command the image must ship is present
#   3. every @font-face the served stylesheet names serves a real WOFF2
#   4. both REQUIRED kiro-cli dispatchers run and report the pinned version
#   5. a real session spawns a PTY and runs the installed kiro-cli
#
# The subject is the THIRD-PARTY payload: the kiro-cli archive, the font set and
# the tool tree as shipped. Nothing here reads this app's own state projections —
# an assertion routed through them tests the reducer that produced them, and the
# tool engine's are also vacuous on an empty list (`[] | join(",")` is "").
#
# Assertion 5 is TERMINAL-SURFACE coverage and nothing else: it proves this
# app's own job (a PTY in a browser) end to end - session REST, PTY spawn, the
# installed kiro-cli executing, the screen buffer, the WebSocket.
# Client-to-server input delivery stays UNASSERTED, because the
# WebSocket client the image ships cannot send.
#
# Everything runs INSIDE the container (the harness publishes no ports), so the
# runner needs nothing but docker: the image ships curl (its own HEALTHCHECK is
# curl, and its curl is built with ws), jq, tr, head and timeout. Full
# JS-executing boot checks live in static-src/e2e/ for local runs, deliberately
# NOT in CI.
#
# No separate negative control: every assertion below is behavioural and fails
# LOUD rather than going vacuous. An absent command is named, a renamed dispatcher
# or a truncated one reports the wrong version string, an unserved font 404s, a
# dropped face fails the count, and a session that never renders times out.
smoke_verify() {
  wt_base=http://127.0.0.1:9848

  # ---- the served importmap resolves ----------------------------------------
  # This is the deterministic core of the browser failure class: /vendor/** is
  # gitignored AND dockerignored, produced during the image build, so tsc and the
  # Docker build both stay green when a vendor copy is missing or a library
  # renamed a subpath - and the browser then aborts module loading behind the
  # loading overlay.
  # Same split as the stylesheet below: the fetch reports its own status, so a dead
  # `/` is not reported as an index that carries no importmap.
  wt_index=$(docker exec "$SMOKE_CONTAINER" curl -sfS --max-time 5 "$wt_base/") || {
    printf 'FAIL: / is not served\n' >&2
    return 1
  }
  wt_targets=$(printf '%s\n' "$wt_index" \
    | sed -n '/<script type="importmap">/,/<\/script>/p' \
    | grep -o '"/[^"]*"' | tr -d '"')
  [ -n "$wt_targets" ] || {
    printf 'FAIL: served index.html carries no importmap targets\n' >&2
    return 1
  }
  wt_n=0
  for wt_t in $wt_targets; do
    wt_n=$((wt_n + 1))
    wt_size=$(docker exec "$SMOKE_CONTAINER" curl -sfS --max-time 5 -o /dev/null \
      -w '%{size_download}' "$wt_base$wt_t") || {
      printf 'FAIL: importmap target %s is not served (missing vendor tree in the image?)\n' "$wt_t" >&2
      return 1
    }
    [ "$wt_size" -gt 0 ] || {
      printf 'FAIL: importmap target %s served an empty body\n' "$wt_t" >&2
      return 1
    }
  done
  printf 'importmap: all %s targets served\n' "$wt_n"

  # ---- the system commands the image must ship are PRESENT -------------------
  # Presence, not the package database: dpkg keeps reporting a package whose files
  # are gone. Probed with `command -v` against the image's own PATH rather than
  # through /api/tools, whose .system[] projection is this app's own reducer over
  # the same question. The list is the set main.go declares as required; a name
  # added there is unchecked until it is added here too.
  wt_absent=$(docker exec "$SMOKE_CONTAINER" sh -c \
    'for c in git jq curl unzip xz ssh tar bash; do command -v "$c" >/dev/null 2>&1 || printf "%s " "$c"; done') || {
    printf 'FAIL: could not probe the image for the system commands it must ship\n' >&2
    return 1
  }
  [ -z "$wt_absent" ] || {
    printf 'FAIL: system commands are missing from the image: %s\n' "$wt_absent" >&2
    return 1
  }
  printf 'tools: every required system command present\n'

  # ---- every @font-face the served CSS names serves a real WOFF2 ------------
  # The Dockerfile digest-pins four Monaspace faces, but nothing checks that the
  # stylesheet and the shipped files still agree: a face renamed on either side
  # leaves tsc and the build green and the browser silently falls back to a system
  # font. Checked by file magic rather than by a 200, because the static tree is
  # embedded in the binary and a wrong-body response would still answer 200.
  #
  # The fetch is its OWN command, not the head of the parse pipeline: an assignment
  # takes the pipeline's LAST status, so a dead /style.css would arrive at the
  # emptiness check below and be reported as a stylesheet declaring no face.
  wt_css=$(docker exec "$SMOKE_CONTAINER" curl -sfS --max-time 5 "$wt_base/style.css") || {
    printf 'FAIL: /style.css is not served\n' >&2
    return 1
  }
  # Either quote style, because the served bundle is regenerated from the published
  # web-terminal-ui CSS at build time and the quoting is that library's to choose.
  wt_fonts=$(printf '%s\n' "$wt_css" \
    | grep -o "url([\"']\{0,1\}[^)\"']*woff2" | sed "s/url([\"']\{0,1\}//" | sort -u)
  [ -n "$wt_fonts" ] || {
    printf 'FAIL: the served style.css declares no woff2 face\n' >&2
    return 1
  }
  wt_nf=0
  for wt_f in $wt_fonts; do
    wt_nf=$((wt_nf + 1))
    # A relative target would otherwise be pasted onto the origin and reported as
    # a font the server does not serve, which names the wrong fault.
    case "$wt_f" in
      /*) : ;;
      *)
        printf 'FAIL: style.css names font %s by a relative URL; this check resolves absolute paths only\n' "$wt_f" >&2
        return 1
        ;;
    esac
    wt_magic=$(docker exec "$SMOKE_CONTAINER" sh -c \
      'curl -sfS --max-time 5 -o /tmp/smoke-font.bin "$1" && head -c 4 /tmp/smoke-font.bin' \
      _ "$wt_base$wt_f") || {
      printf 'FAIL: font %s is named by style.css but not served\n' "$wt_f" >&2
      return 1
    }
    [ "$wt_magic" = wOF2 ] || {
      printf 'FAIL: font %s served a non-WOFF2 body (magic %s)\n' "$wt_f" "$wt_magic" >&2
      return 1
    }
  done
  # Counted, because "every face the CSS names is served" is satisfied by a
  # stylesheet that kept one face and dropped the other three.
  [ "$wt_nf" -eq 4 ] || {
    printf 'FAIL: the served style.css names %s woff2 faces, want the 4 the Dockerfile pins\n' "$wt_nf" >&2
    return 1
  }
  printf 'fonts: all %s faces served as WOFF2\n' "$wt_nf"

  # ---- the REQUIRED dispatcher set is complete and RUNNABLE at the pin ------
  # The install manager probes only the dispatcher it activates; the chat sidecar
  # is checked for presence alone, so a truncated or half-written kiro-cli-chat
  # installs clean, reports healthy, and kills every terminal at chat. Matched on
  # OUTPUT, not on exit status: an empty file execs successfully and prints
  # nothing. The absolute version-directory path is deliberate - the convenience
  # symlink under the tools bin dir is never evidence of what the product runs.
  wt_pin=$(docker exec "$SMOKE_CONTAINER" \
    sed -n 's/^KIRO_CLI_VERSION="\(.*\)"$/\1/p' /opt/web-terminal-kiro/entrypoint.sh)
  [ -n "$wt_pin" ] || {
    printf 'FAIL: could not read KIRO_CLI_VERSION out of the image entrypoint\n' >&2
    return 1
  }
  for wt_d in kiro-cli kiro-cli-chat; do
    wt_out=$(docker exec "$SMOKE_CONTAINER" sh -c \
      "timeout 20 /config/tools/kiro-cli-versions/$wt_pin/$wt_d --version 2>&1 | head -1") || true
    case "$wt_out" in
      "$wt_d $wt_pin") : ;;
      *)
        printf 'FAIL: %s in the pinned version directory reported "%s", want "%s %s"\n' \
          "$wt_d" "$wt_out" "$wt_d" "$wt_pin" >&2
        return 1
        ;;
    esac
  done
  printf 'kiro-cli: both required dispatchers report %s\n' "$wt_pin"

  # ---- a real session: PTY in, the installed kiro-cli running ----------------
  # No credential is needed. An unauthenticated container stops at kiro-cli's own
  # interactive login-method menu, which is the interaction point this app depends
  # on (the session command runs whoami, then login --use-device-flow, then chat).
  #
  # What the frame assertion proves: the PTY spawned, the app's sign-in guard ran,
  # and the installed kiro-cli EXECUTED, since the guard only prints that line once
  # `whoami` has run and exited non-zero. The login menu's own wording is NOT
  # matched: it is upstream's, pinned to no version here, and kiro-cli erases the
  # full viewport on a redraw, so a guard line on the login prompt's wording would
  # turn CI red on a healthy image. Nothing this app owns is left unchecked by
  # dropping it - the dispatcher block above is what covers the chat sidecar.
  #
  # No request body: the engine's create handler ignores it entirely, so sending
  # cols/rows would read as configuring a size it does not set.
  wt_id=$(docker exec "$SMOKE_CONTAINER" sh -c \
    'curl -sfS --max-time 10 -X POST -o /tmp/smoke-session.json "$1/api/sessions" && jq -r "$2" /tmp/smoke-session.json' \
    _ "$wt_base" '.id // empty') || {
    printf 'FAIL: POST /api/sessions was refused; the session-create gate is closed or the route is gone\n' >&2
    return 1
  }
  [ -n "$wt_id" ] || {
    printf 'FAIL: POST /api/sessions returned no session id\n' >&2
    return 1
  }
  wt_try=0
  wt_frames=""
  while [ "$wt_try" -lt 15 ]; do
    wt_try=$((wt_try + 1))
    wt_st=$(docker exec "$SMOKE_CONTAINER" sh -c \
      'curl -sfS --max-time 5 -o /tmp/smoke-sessions.json "$1/api/sessions" && jq -r --arg id "$2" "$3" /tmp/smoke-sessions.json' \
      _ "$wt_base" "$wt_id" '.[] | select(.id == $id) | .status') || {
      printf 'FAIL: GET /api/sessions stopped answering while the session was running\n' >&2
      return 1
    }
    case "$wt_st" in
      exited | crashed)
        printf 'FAIL: session %s reported %s: the PTY command died at once (kiro-cli unrunnable, or refusing the launch flags this app passes it)\n' "$wt_id" "$wt_st" >&2
        return 1
        ;;
    esac
    # One bounded attach per attempt, never a single grep: the server replays the
    # screen on every attach, so a slow first paint is caught by the next round.
    # The shipped client needs no bootstrap frame and no wire encoder, and the
    # frame payload carries the screen text as plain ASCII.
    docker exec "$SMOKE_CONTAINER" sh -c \
      'curl -sS --no-buffer --max-time 2 -o /tmp/smoke-frames.bin "$1" >/dev/null 2>&1; exit 0' \
      _ "ws://127.0.0.1:9848/ws?session=$wt_id"
    wt_frames=$(docker exec "$SMOKE_CONTAINER" sh -c \
      "tr -c '[:print:]\n' '\n' < /tmp/smoke-frames.bin 2>/dev/null || true")
    printf '%s' "$wt_frames" | grep -qF 'kiro-cli is not signed in' || continue
    docker exec "$SMOKE_CONTAINER" sh -c \
      'curl -sfS --max-time 5 -X DELETE "$1/api/sessions/$2" >/dev/null 2>&1 || true' \
      _ "$wt_base" "$wt_id"
    printf 'session: the PTY ran the installed kiro-cli %s and streamed its sign-in guard (attempt %s)\n' "$wt_pin" "$wt_try"
    return 0
  done
  printf 'FAIL: session %s never streamed the expected sign-in screen; readable frame text was:\n' "$wt_id" >&2
  printf '%s\n' "$wt_frames" | tail -20 >&2
  return 1
}
